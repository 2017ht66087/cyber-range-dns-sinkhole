# Run from MGMT-ORCH (10.10.10.20). Configures guests after 02-deploy-vms.
# Populate ansible_user / ssh keys per your golden templates.

[firewall]
sec-gw ansible_host=10.10.10.1

[servers]
svc-dc    ansible_host=10.10.20.10 ansible_connection=winrm
svc-sink  ansible_host=10.10.20.11
svc-log   ansible_host=10.10.20.20

[soc]
soc-seconion ansible_host=10.10.60.10
soc-dash     ansible_host=10.10.60.20

[external]
ext-dns     ansible_host=10.10.50.53
ext-inetsim ansible_host=10.10.50.80

[attacker]
atk-c2 ansible_host=10.10.40.10

[endpoints]
ep-clean    ansible_host=10.10.30.100 ansible_connection=winrm
ep-infected ansible_host=10.10.30.101 ansible_connection=winrm

[linux:children]
external
attacker
[linux:vars]
ansible_user=range-admin
