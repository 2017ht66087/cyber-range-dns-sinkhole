# EXT-DNS :: /etc/dnsmasq.d/external.conf
# Path B (sinkhole OFF): the "external" resolver answers malicious lookups
# with the attacker VM IP so the benign beacon can connect. All queries logged.
address=/evil-c2.range/10.10.40.10
address=/bad-exfil.range/10.10.40.10
log-queries
log-facility=/var/log/dnsmasq.log
# Any other name -> mock internet web server (INetSim).
address=/#/10.10.50.80
