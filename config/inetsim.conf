# EXT-INETSIM :: /etc/inetsim/inetsim.conf
# Mock internet. Serves benign responses for HTTP/HTTPS/DNS/SMTP/etc so the
# range never touches the real internet. Bind to the EXTERNAL zone IP only.
service_bind_address   10.10.50.80
dns_default_ip         10.10.50.80

start_service dns
start_service http
start_service https
start_service smtp
start_service pop3
start_service ftp

# Fake-malicious domains resolve to the attacker VM even via INetSim DNS,
# keeping Path B consistent if endpoints use INetSim as resolver.
dns_static  evil-c2.range   10.10.40.10
dns_static  bad-exfil.range 10.10.40.10
