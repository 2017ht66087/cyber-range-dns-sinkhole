# SVC-SINK :: /etc/unbound/unbound.conf.d/sinkhole.conf
# Path A (sinkhole ON): redirect fake-malicious domains to the sinkhole IP
# and log every query so the SOC can name the infected host immediately.
server:
    interface: 0.0.0.0
    access-control: 10.10.0.0/16 allow
    log-queries: yes
    verbosity: 2

    # --- Sinkhole zones (fake malicious domains -> dead-end sink IP) ---
    local-zone: "evil-c2.range" redirect
    local-data: "evil-c2.range A 10.10.60.5"
    local-zone: "bad-exfil.range" redirect
    local-data: "bad-exfil.range A 10.10.60.5"

# Everything legitimate forwards to internal AD DNS.
forward-zone:
    name: "."
    forward-addr: 10.10.20.10
