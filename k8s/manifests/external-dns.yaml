apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: dns-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      containers:
      - name: dns
        image: external-dns:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: MALICIOUS_DOMAIN
          value: "teq.xyz.com"
        - name: ATTACKER_IP
          value: "203.0.113.66"
        - name: ALT_DOMAIN
          value: "abc.com"
        - name: BENIGN_PUBLIC_IP
          value: "93.184.216.34"
        ports:
        - containerPort: 53
          protocol: UDP
        - containerPort: 53
          protocol: TCP
        resources:
          requests: { cpu: "10m", memory: "32Mi" }
          limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns
  namespace: dns-system
spec:
  selector:
    app: external-dns
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
