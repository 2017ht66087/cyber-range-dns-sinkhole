apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: dns-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
    spec:
      containers:
      - name: dns
        image: external-dns:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: range-mode
            optional: true
        # Fixed clusterIPs of fake-c2 / fake-web (manifests/fake-internet.yaml).
        # Set here, not in range-mode, so scenario launches never drop them.
        env:
        - name: FAKE_C2_IP
          value: "10.43.66.66"
        - name: FAKE_WEB_IP
          value: "10.43.80.80"
        ports:
        - containerPort: 53
          protocol: UDP
        - containerPort: 53
          protocol: TCP
        resources:
          requests: { cpu: "10m", memory: "32Mi" }
          limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns
  namespace: dns-system
spec:
  selector:
    app: external-dns
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
