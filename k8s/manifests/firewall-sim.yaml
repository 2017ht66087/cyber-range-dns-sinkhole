# Single firewall-sim used by BOTH variants. Behavior is driven by the
# range-mode ConfigMap (envFrom), so switching variants = swap the ConfigMap
# + rollout restart. No per-variant Deployment needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firewall-sim
  namespace: cyber-range
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firewall-sim
  template:
    metadata:
      labels:
        app: firewall-sim
    spec:
      containers:
      - name: firewall
        image: firewall-sim:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: range-mode
        env:
        - name: INTERNAL_DNS
          value: "internal-dns.dns-system.svc.cluster.local"
        - name: EXTERNAL_DNS
          value: "external-dns.dns-system.svc.cluster.local"
        - name: SINKHOLE_URL
          value: "http://sinkhole.cyber-range.svc.cluster.local:8080/capture"
        ports:
        - containerPort: 8053
          protocol: UDP
        - containerPort: 8053
          protocol: TCP
        resources:
          requests: { cpu: "10m", memory: "32Mi" }
          limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: firewall-sim
  namespace: cyber-range
spec:
  selector:
    app: firewall-sim
  ports:
  - name: dns-udp
    port: 8053
    targetPort: 8053
    protocol: UDP
  - name: dns-tcp
    port: 8053
    targetPort: 8053
    protocol: TCP
