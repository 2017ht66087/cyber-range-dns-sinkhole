# OPT-IN lateral-movement surface: infected-pc (cyber-range) -> corp servers.
# Not applied by 03-deploy.sh unless CORP_LATERAL=1. Enable / disable:
#   sudo k3s kubectl apply  -f manifests/corp-lateral.yaml
#   sudo k3s kubectl delete -f manifests/corp-lateral.yaml
#
# Narrow on purpose: only the infected endpoint, only these ports. Its off-cluster
# C2 callback stays denied, so the sinkhole containment story is unchanged.
#   dc01/dc02 : 53 DNS, 88 Kerberos, 389 LDAP, 445 SMB  (recon, Kerberoasting)
#   db01      : 5432 PostgreSQL                         (hr.payroll exfil target)
#   db02      : 3306 MariaDB
#   web01/02  : 80 / 8080 HTTP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-infected-to-corp
  namespace: cyber-range
spec:
  podSelector:
    matchLabels: { app: infected-pc }
  policyTypes: ["Egress"]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: corp }
    ports:
    - { port: 53,   protocol: UDP }
    - { port: 53,   protocol: TCP }
    - { port: 88,   protocol: UDP }
    - { port: 88,   protocol: TCP }
    - { port: 389,  protocol: TCP }
    - { port: 445,  protocol: TCP }
    - { port: 5432, protocol: TCP }
    - { port: 3306, protocol: TCP }
    - { port: 80,   protocol: TCP }
    - { port: 8080, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-infected-pc
  namespace: corp
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: cyber-range }
      podSelector:
        matchLabels: { app: infected-pc }
    ports:
    - { port: 53,   protocol: UDP }
    - { port: 53,   protocol: TCP }
    - { port: 88,   protocol: UDP }
    - { port: 88,   protocol: TCP }
    - { port: 389,  protocol: TCP }
    - { port: 445,  protocol: TCP }
    - { port: 5432, protocol: TCP }
    - { port: 3306, protocol: TCP }
    - { port: 80,   protocol: TCP }
    - { port: 8080, protocol: TCP }
