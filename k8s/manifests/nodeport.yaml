# Fixed host-reachable endpoints (survive pod/ClusterIP changes).
# Reach them at  <node-ip>:<nodePort>  e.g. 192.168.9.50:30080
#   sinkhole  HTTP : 30080   (view captures / test callbacks)
#   firewall  DNS  : 30053   (query the policy engine from the host)
apiVersion: v1
kind: Service
metadata:
  name: sinkhole-nodeport
  namespace: cyber-range
spec:
  type: NodePort
  selector:
    app: sinkhole
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: firewall-nodeport
  namespace: cyber-range
spec:
  type: NodePort
  selector:
    app: firewall-sim
  ports:
  - name: dns-udp
    port: 8053
    targetPort: 8053
    protocol: UDP
    nodePort: 30053
  - name: dns-tcp
    port: 8053
    targetPort: 8053
    protocol: TCP
    nodePort: 30053
---
# Upstream resolvers exposed for direct host testing:
#   internal-dns (benign)   : 192.168.9.50:30054
#   external-dns (attacker) : 192.168.9.50:30055
apiVersion: v1
kind: Service
metadata:
  name: internal-dns-nodeport
  namespace: dns-system
spec:
  type: NodePort
  selector:
    app: internal-dns
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
    nodePort: 30054
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
    nodePort: 30054
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns-nodeport
  namespace: dns-system
spec:
  type: NodePort
  selector:
    app: external-dns
  ports:
  - name: dns-udp
    port: 53
    targetPort: 53
    protocol: UDP
    nodePort: 30055
  - name: dns-tcp
    port: 53
    targetPort: 53
    protocol: TCP
    nodePort: 30055
