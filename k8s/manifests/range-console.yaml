# Range console: authenticated web UI for custom scenarios (NodePort 30090).
#
# The console's ServiceAccount can only:
#   * cyber-range / dns-system : read+patch the range-mode ConfigMap, read+patch
#                                deployments (restart / scale), read pods + logs
#   * fake-internet            : read deployments, pods + logs
#   * range-admin              : manage its own scenario ConfigMap and read/patch
#                                the console-auth Secret (login hash)
# The console-auth Secret is created by 03-deploy.sh (never stored in git).
---
apiVersion: v1
kind: Namespace
metadata:
  name: range-admin
  labels:
    app.kubernetes.io/part-of: cyber-range
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: range-console
  namespace: range-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: range-console-operator
  namespace: cyber-range
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["range-mode"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: range-console-operator
  namespace: cyber-range
subjects:
- kind: ServiceAccount
  name: range-console
  namespace: range-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: range-console-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: range-console-operator
  namespace: dns-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["range-mode"]
  verbs: ["get", "patch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "patch"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: range-console-operator
  namespace: dns-system
subjects:
- kind: ServiceAccount
  name: range-console
  namespace: range-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: range-console-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: range-console-viewer
  namespace: fake-internet
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: range-console-viewer
  namespace: fake-internet
subjects:
- kind: ServiceAccount
  name: range-console
  namespace: range-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: range-console-viewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: range-console-self
  namespace: range-admin
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["range-scenarios"]
  verbs: ["get", "patch", "update"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["console-auth"]
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: range-console-self
  namespace: range-admin
subjects:
- kind: ServiceAccount
  name: range-console
  namespace: range-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: range-console-self
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: range-console
  namespace: range-admin
  labels:
    app: range-console
spec:
  replicas: 1
  selector:
    matchLabels:
      app: range-console
  template:
    metadata:
      labels:
        app: range-console
    spec:
      serviceAccountName: range-console
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: console
        image: range-console:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        ports:
        - containerPort: 8090
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8090
          initialDelaySeconds: 2
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 20m
            memory: 48Mi
          limits:
            cpu: 300m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: range-console
  namespace: range-admin
spec:
  type: NodePort
  selector:
    app: range-console
  ports:
  - name: http
    port: 8090
    targetPort: 8090
    nodePort: 30090
